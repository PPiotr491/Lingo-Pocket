name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Wybierz Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Projekt jest zapisany w Xcode 27: format pliku (objectVersion = 110) i
      # iOS 27.0 jako minimalna wersja. Runnery mają na razie Xcode 26.x i
      # symulatory iOS 26.x, więc obniżamy oba ustawienia tylko w kopii na
      # runnerze (plik w repozytorium zostaje bez zmian).
      # Do usunięcia, gdy runnery dostaną Xcode 27.
      - name: Dostosuj projekt do Xcode 26
        run: |
          sed -i '' \
            -e 's/objectVersion = 110;/objectVersion = 77;/' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET = 27.0;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/' \
            Lingo.xcodeproj/project.pbxproj
          grep -nE "objectVersion|IPHONEOS_DEPLOYMENT_TARGET" Lingo.xcodeproj/project.pbxproj

      - name: Informacje o środowisku
        run: |
          xcodebuild -version
          xcodebuild -list -project Lingo.xcodeproj
          xcrun simctl list devices available

      # Jeśli kod użyje API z iOS 27, build się wywali - wtedy trzeba
      # poczekać na Xcode 27 na runnerach.
      - name: Build
        run: |
          xcodebuild build \
            -project Lingo.xcodeproj \
            -scheme Lingo \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      # Projekt nie ma jeszcze targetu testowego. Po dodaniu go w Xcode
      # (File > New > Target > Unit Testing Bundle) odkomentuj ten krok.
      # - name: Testy
      #   run: |
      #     xcodebuild test \
      #       -project Lingo.xcodeproj \
      #       -scheme Lingo \
      #       -destination 'platform=iOS Simulator,name=iPhone 17' \
      #       CODE_SIGNING_ALLOWED=NO
