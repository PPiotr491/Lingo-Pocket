name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Wybierz Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Projekt jest zapisany w formacie Xcode 27 (objectVersion = 110), którego
      # Xcode 26.x nie otworzy. Obniżamy wersję formatu tylko w kopii na runnerze.
      # Do usunięcia, gdy runnery dostaną Xcode 27.
      - name: Obniż format projektu do Xcode 26
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Lingo.xcodeproj/project.pbxproj

      - name: Informacje o środowisku
        run: |
          xcodebuild -version
          xcodebuild -list -project Lingo.xcodeproj
          xcrun simctl list devices available

      # Projekt ma IPHONEOS_DEPLOYMENT_TARGET = 27.0, a runnery GitHuba mają
      # na razie Xcode 26.x. Nadpisujemy target tylko na CI (plik projektu
      # zostaje bez zmian). Jeśli kod użyje API z iOS 27, build się wywali -
      # wtedy trzeba poczekać na Xcode 27 na runnerach.
      - name: Build
        run: |
          xcodebuild build \
            -project Lingo.xcodeproj \
            -scheme Lingo \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO

      # Projekt nie ma jeszcze targetu testowego. Po dodaniu go w Xcode
      # (File > New > Target > Unit Testing Bundle) odkomentuj ten krok.
      # - name: Testy
      #   run: |
      #     xcodebuild test \
      #       -project Lingo.xcodeproj \
      #       -scheme Lingo \
      #       -destination 'platform=iOS Simulator,name=iPhone 17' \
      #       IPHONEOS_DEPLOYMENT_TARGET=26.0 \
      #       CODE_SIGNING_ALLOWED=NO
